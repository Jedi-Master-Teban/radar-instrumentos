[project]
name = "radar-instrumentos"
version = "0.1.0"
description = "Radar diario de instrumentos usados en EE. UU. con validación de margen en Colombia"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.45", "beautifulsoup4>=4.12", "httpx>=0.27", "openai>=1.40",
  "fastapi>=0.110", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["radar*"]
[tool.setuptools.package-data]
radar = ["web/templates/*.html"]
[tool.pytest.ini_options]
testpaths = ["tests"]
