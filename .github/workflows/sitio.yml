name: Publicar sitio

on:
  push:
    branches: [main]
    paths: ["datos/**", "radar/**", ".github/workflows/sitio.yml"]
  schedule:
    - cron: "17 11 * * *"   # todos los días, 6:17 a. m. en Bogotá: TRM y precios de Colombia del día
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # Precios de Colombia de armados anteriores: los vigentes no se vuelven a consultar en las tiendas
      - uses: actions/cache/restore@v4
        with:
          path: .cache/referencias_co.json
          key: colombia-${{ github.run_id }}
          restore-keys: colombia-
      - name: Construir el sitio
        run: python -m radar sitio --salida _site --repo "${{ github.repository }}" --cache .cache/referencias_co.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/referencias_co.json
          key: colombia-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
