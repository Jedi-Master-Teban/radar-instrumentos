{% extends "base.html" %}{% block cuerpo %}
<h1>Eventos</h1><div class="caja tabla"><table><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th></tr>
{% for ev in eventos %}<tr><td>{{ ev.fecha }}</td><td>{{ ev.tipo }}</td><td>{{ ev.detalle }}</td></tr>{% else %}<tr><td class="suave">Sin eventos.</td></tr>{% endfor %}</table></div>
{% endblock %}
